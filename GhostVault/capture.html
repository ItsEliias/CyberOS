<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Capture</title>
<style>
/* ─── RESET ─────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ═══ CORE THEMES ═══ */
.window[data-core="stealth"]  { --bg:#0e1117; --bg2:#0b0f15; --bg3:#161b22; --border:#30363d; --text:#c9d1d9; --text-muted:#8b949e; --text-dim:#6b7a99; }
.window[data-core="graphite"] { --bg:#111318; --bg2:#0d0f14; --bg3:#1a1f27; --border:#2a313d; --text:#d8dee9; --text-muted:#8892a4; --text-dim:#6b7591; }
.window[data-core="frost"]    { --bg:#f3f6fb; --bg2:#eaeff7; --bg3:#ffffff; --border:#d7dde7; --text:#111827; --text-muted:#4b5563; --text-dim:#9ca3af; }
.window[data-core="oled"]     { --bg:#000000; --bg2:#000000; --bg3:#0b0b0b; --border:#1a1a1a; --text:#f5f5f5; --text-muted:#888888; --text-dim:#555555; }

/* ═══ PERSONALITY THEMES ═══ */
.window[data-personality="neutral"]  { --p-accent:#4a9eff; --p-dim:rgba(74,158,255,0.12); --p-glow:rgba(74,158,255,0.25); }
.window[data-personality="cyberpunk"]{ --p-accent:#b44fff; --p-dim:rgba(180,79,255,0.12); --p-glow:rgba(180,79,255,0.3); }
.window[data-personality="terminal"] { --p-accent:#00ff41; --p-dim:rgba(0,255,65,0.10);   --p-glow:rgba(0,255,65,0.25);  }
.window[data-personality="threat"]   { --p-accent:#cc0000; --p-dim:rgba(204,0,0,0.12);    --p-glow:rgba(204,0,0,0.3);   }

/* ─── BASE VARS ─────────────────────────────────────────────────────────── */
:root {
  --bg: #0e1117; --bg2: #0b0f15; --bg3: #161b22; --border: #30363d;
  --text: #c9d1d9; --text-muted: #8b949e; --text-dim: #6b7a99;
  --accent: #4a9eff; --accent-dim: rgba(74,158,255,0.12); --accent-glow: rgba(74,158,255,0.25);
  --radius: 8px; --font: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;

  /* legacy aliases for backward compat */
  --bg4:       #232338;
  --border2:   #333355;
  --text-sub:  #8888aa;
}

/* ─── MODE ACCENT OVERRIDES (layer on top of personality) ───────────────── */
.window[data-mode="work"]     { --accent:#4a9eff; --accent-dim:rgba(74,158,255,0.12); --accent-glow:rgba(74,158,255,0.25); }
.window[data-mode="cyber"]    { --accent:#c41eff; --accent-dim:rgba(196,30,255,0.12); --accent-glow:rgba(196,30,255,0.25); }
.window[data-mode="personal"] { --accent:#22dd88; --accent-dim:rgba(34,221,136,0.12); --accent-glow:rgba(34,221,136,0.25); }

html, body {
  width:100%; height:100%;
  background:transparent;
  font-family:var(--font);
  color:var(--text);
  user-select:none;
  -webkit-app-region:no-drag;
  overflow:hidden;
}

/* ─── WINDOW SHELL ──────────────────────────────────────────────────────── */
.window {
  width:100%; height:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:13px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 28px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.04), 0 0 40px var(--accent-glow);
  transition:box-shadow .3s ease;
}

/* ─── TITLEBAR ──────────────────────────────────────────────────────────── */
.titlebar {
  height: 42px; background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 10px;
  flex-shrink: 0; -webkit-app-region: drag;
}
.dots { display: flex; gap: 6px; -webkit-app-region: no-drag; }
.dot {
  width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
  transition: opacity 0.15s; flex-shrink: 0;
}
.dot-close  { background: #ff5f57; }
.dot-min    { background: #febc2e; }
.dot-max    { background: #28c840; }
.dot:hover  { opacity: 0.8; }
.titlebar-brand { display: flex; align-items: center; gap: 6px; flex: 1; -webkit-app-region: drag; }
.titlebar-icon {
  width: 22px; height: 22px; border-radius: 6px; background: var(--accent-dim);
  border: 1px solid var(--accent); color: var(--accent); font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; letter-spacing: 0.5px;
  flex-shrink: 0;
}
.titlebar-name { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--text); }
.titlebar-sub  { font-size: 10px; color: var(--accent); opacity: 0.55; }
.mode-pills { display: flex; gap: 4px; -webkit-app-region: no-drag; }
.mode-pill {
  padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500;
  border: 1px solid var(--border); background: transparent; color: var(--text-muted);
  cursor: pointer; transition: all 0.15s ease; -webkit-app-region: no-drag;
  font-family: var(--font);
}
.mode-pill:hover  { border-color: var(--accent); color: var(--text); }
.mode-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

/* ─── LEGACY kb hint (kept for keyboard shortcut display) ───────────────── */
.tb-hint {
  font-size:10px;
  color:var(--text-muted);
  -webkit-app-region:no-drag;
}
.kb {
  display:inline-block;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:3px;
  padding:1px 4px;
  font-size:9.5px;
  font-family:var(--font);
  color:var(--text-muted);
}

/* ─── CAPTURE THEME PICKER ──────────────────────────────────────────────── */
.cap-theme-wrap { position: relative; }
.cap-theme-btn {
  height: 26px; padding: 0 9px; border-radius: 6px; font-size: 10px; font-weight: 600;
  background: var(--bg3); border: 1px solid var(--border); color: var(--text-muted);
  cursor: pointer; font-family: var(--font); white-space: nowrap;
  transition: border-color .15s, color .15s;
}
.cap-theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.cap-theme-panel {
  display: none; position: absolute; bottom: calc(100% + 8px); right: 0;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; min-width: 200px; z-index: 999;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
  flex-direction: column; gap: 4px;
}
.cap-theme-panel.open { display: flex; }
.ctp-label { font-size: 9px; font-weight: 700; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 4px; }
.ctp-row { display: flex; gap: 4px; }
.cap-theme-chip {
  flex: 1; padding: 5px 4px; font-size: 10px; font-weight: 500;
  background: var(--bg4,#1a2130); border: 1px solid var(--border);
  border-radius: 5px; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; gap: 4px; font-family: var(--font);
  transition: border-color .15s, color .15s;
}
.cap-theme-chip:hover { border-color: var(--accent); color: var(--text); }
.cap-theme-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim,rgba(74,158,255,.1)); }
.ctp-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ─── MODE TABS (legacy strip — hidden, replaced by pills in titlebar) ──── */
.mode-strip { display: none; }
.mode-btn {
  flex:1;
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  color:var(--text-muted);
  font-family:var(--font);
  font-size:12px;
  font-weight:600;
  padding:9px 4px 7px;
  cursor:pointer;
  transition:color .15s, border-color .15s;
  letter-spacing:.02em;
  -webkit-app-region:no-drag;
}
.mode-btn:hover { color:var(--text-muted); }
.mode-btn.active {
  color:var(--accent);
  border-bottom-color:var(--accent);
}

/* ─── META ROW ──────────────────────────────────────────────────────────── */
.meta-row {
  display:flex;
  gap:6px;
  padding:8px 10px 0;
  flex-shrink:0;
  -webkit-app-region:no-drag;
}
.sel {
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-family:var(--font);
  font-size:11.5px;
  padding:5px 8px;
  outline:none;
  cursor:pointer;
  transition:border-color .15s;
  -webkit-app-region:no-drag;
}
.sel:focus { border-color:var(--accent); }
.sel option { background:var(--bg2); }
.sel-template { flex:1; min-width:0; }
.sel-folder   { width:110px; flex-shrink:0; }

/* ─── TITLE ROW ─────────────────────────────────────────────────────────── */
.title-row {
  padding:6px 10px 0;
  flex-shrink:0;
  -webkit-app-region:no-drag;
}
.title-input {
  width:100%;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-family:var(--font);
  font-size:12px;
  font-weight:500;
  padding:5px 10px;
  outline:none;
  transition:border-color .15s;
  user-select:text;
  -webkit-app-region:no-drag;
}
.title-input::placeholder { color:var(--text-muted); font-weight:400; }
.title-input:focus { border-color:var(--accent); }

/* ─── CONTENT AREA ──────────────────────────────────────────────────────── */
.content-area {
  flex:1;
  min-height:0;
  position:relative;
  padding:6px 10px;
  -webkit-app-region:no-drag;
}
.cap-textarea, .cap-preview {
  position:absolute;
  inset:6px 10px;
  border-radius:var(--radius);
  font-family:var(--font-mono);
  font-size:12.5px;
  line-height:1.65;
  padding:10px 12px;
}
.cap-textarea {
  resize:none;
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text);
  outline:none;
  transition:border-color .15s;
  user-select:text;
  -webkit-app-region:no-drag;
  spellcheck:true;
}
.cap-textarea::placeholder { color:var(--text-muted); font-family:var(--font); font-size:12px; }
.cap-textarea:focus { border-color:var(--accent); }

.cap-preview {
  background:var(--bg3);
  border:1px solid var(--border);
  overflow-y:auto;
  font-family:var(--font);
  font-size:12.5px;
  line-height:1.7;
  color:var(--text);
}
.cap-preview.hidden, .cap-textarea.hidden { display:none; }

/* preview markdown styles */
.cap-preview h1 { font-size:15px; font-weight:700; margin:0 0 8px; color:var(--accent); }
.cap-preview h2 { font-size:13px; font-weight:600; margin:12px 0 6px; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:3px; }
.cap-preview h3 { font-size:12px; font-weight:600; margin:10px 0 4px; color:var(--text-sub); }
.cap-preview p  { margin:0 0 6px; }
.cap-preview ul, .cap-preview ol { padding-left:18px; margin:0 0 6px; }
.cap-preview li { margin:2px 0; }
.cap-preview pre { background:var(--bg4); border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin:6px 0; overflow-x:auto; font-size:11px; }
.cap-preview code { background:var(--bg4); border-radius:3px; padding:1px 4px; font-size:11px; color:var(--accent); }
.cap-preview pre code { background:none; padding:0; color:var(--text-sub); }
.cap-preview blockquote { border-left:3px solid var(--accent); padding-left:10px; margin:6px 0; color:var(--text-sub); }
.cap-preview hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
.cap-preview table { border-collapse:collapse; width:100%; margin:6px 0; font-size:11.5px; }
.cap-preview th { background:var(--bg4); padding:4px 8px; text-align:left; border:1px solid var(--border); }
.cap-preview td { padding:3px 8px; border:1px solid var(--border); }
.cap-preview .md-check { display:flex; align-items:baseline; gap:5px; margin:2px 0; }
.cap-preview strong { color:var(--text); }

/* ─── AI ACTIONS BAR ────────────────────────────────────────────────────── */
.actions-bar {
  display:flex;
  gap:4px;
  padding:0 10px 6px;
  flex-shrink:0;
  -webkit-app-region:no-drag;
}
.action-chip {
  flex:1;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text-sub);
  font-family:var(--font);
  font-size:11px;
  font-weight:500;
  padding:5px 4px;
  cursor:pointer;
  transition:all .15s;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  -webkit-app-region:no-drag;
}
.action-chip:hover {
  background:var(--accent-dim);
  border-color:var(--accent);
  color:var(--accent);
}
.action-chip.primary {
  background:var(--accent-dim);
  border-color:var(--accent);
  color:var(--accent);
  font-weight:600;
}
.action-chip.primary:hover {
  background:var(--accent);
  color:#fff;
}
.action-chip:disabled { opacity:.35; cursor:default; pointer-events:none; }

/* ─── FOOTER ────────────────────────────────────────────────────────────── */
.footer {
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 10px 10px;
  flex-shrink:0;
  -webkit-app-region:no-drag;
}
.footer-left  { display:flex; gap:4px; }
.footer-right { display:flex; gap:4px; margin-left:auto; }

.tool-btn {
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text-sub);
  font-family:var(--font);
  font-size:11px;
  padding:5px 9px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
  transition:all .15s;
  white-space:nowrap;
  -webkit-app-region:no-drag;
}
.tool-btn:hover { border-color:var(--border2); color:var(--text); }
.tool-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

.btn-save {
  background:var(--accent);
  border:none;
  border-radius:6px;
  color:#fff;
  font-family:var(--font);
  font-size:12px;
  font-weight:700;
  padding:6px 18px;
  cursor:pointer;
  letter-spacing:.03em;
  transition:opacity .15s, transform .1s;
  -webkit-app-region:no-drag;
}
.btn-save:hover  { opacity:.88; }
.btn-save:active { transform:scale(.97); }
.btn-save:disabled { opacity:.35; cursor:default; }

/* ─── FORMATTING SPINNER ────────────────────────────────────────────────── */
.fmt-overlay {
  position:absolute;
  inset:6px 10px;
  background:rgba(15,15,26,.88);
  border-radius:var(--radius);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  z-index:10;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s;
}
.fmt-overlay.show { opacity:1; pointer-events:all; }
.fmt-spinner {
  width:24px; height:24px;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .6s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.fmt-label { font-size:12px; color:var(--text-sub); }

/* ─── TOAST ─────────────────────────────────────────────────────────────── */
.toast {
  position:fixed;
  bottom:12px; left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:#000;
  font-size:11px;
  font-weight:700;
  padding:5px 16px;
  border-radius:20px;
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
  white-space:nowrap;
  z-index:100;
  letter-spacing:.02em;
}
.toast.show { opacity:1; }
.toast.err  { background:#ff453a; color:#fff; }

/* ─── CAPTURE FOOTER (status bar) ──────────────────────────────────────── */
.capture-footer {
  height: 26px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; border-top: 1px solid var(--border);
  font-size: 10px; color: var(--text-dim); background: var(--bg2);
}
.cf-sig { opacity: 0.5; }

/* ─── SCROLLBAR ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
</style>
</head>
<body>

<div class="window" id="win" data-mode="work">

  <!-- ── Titlebar ────────────────────────────────────────────────────────── -->
  <div class="titlebar">
    <!-- macOS traffic lights -->
    <div class="dots">
      <div class="dot dot-close"  onclick="window.ghostvault.closeWindow()"></div>
      <div class="dot dot-min"    onclick="minimizeSelf()"></div>
      <div class="dot dot-max"    style="opacity:0.3;cursor:default"></div>
    </div>
    <!-- Brand -->
    <div class="titlebar-brand">
      <span class="titlebar-icon">GV</span>
      <span class="titlebar-name">QUICK CAPTURE</span>
      <span class="titlebar-sub">// ItsEliias</span>
    </div>
    <!-- Mode selector pills -->
    <div class="mode-pills">
      <button class="mode-pill active" data-mode="work"     onclick="setMode('work')"    title="⌘1">Work</button>
      <button class="mode-pill"        data-mode="cyber"    onclick="setMode('cyber')"   title="⌘2">Cyber</button>
      <button class="mode-pill"        data-mode="personal" onclick="setMode('personal')" title="⌘3">Personal</button>
    </div>
    <!-- Capture theme picker -->
    <div class="cap-theme-wrap" style="-webkit-app-region:no-drag">
      <button id="cap-theme-btn" class="cap-theme-btn" title="Capture window theme">◑ <span id="cap-theme-label">Stealth·Neutral</span></button>
      <div id="cap-theme-panel" class="cap-theme-panel">
        <div class="ctp-label">WORKSPACE</div>
        <div class="ctp-row">
          <button class="cap-theme-chip active" data-core="stealth"><span class="ctp-swatch" style="background:#4a9eff"></span>Stealth</button>
          <button class="cap-theme-chip" data-core="graphite"><span class="ctp-swatch" style="background:#6ea8fe"></span>Graphite</button>
          <button class="cap-theme-chip" data-core="frost"><span class="ctp-swatch" style="background:#3b82f6"></span>Frost</button>
          <button class="cap-theme-chip" data-core="oled"><span class="ctp-swatch" style="background:#f5f5f5"></span>OLED</button>
        </div>
        <div class="ctp-label" style="margin-top:8px">ATMOSPHERE</div>
        <div class="ctp-row">
          <button class="cap-theme-chip active" data-personality="neutral"><span class="ctp-swatch" style="background:#4a9eff"></span>Neutral</button>
          <button class="cap-theme-chip" data-personality="cyberpunk"><span class="ctp-swatch" style="background:#b44fff"></span>Cyber</button>
          <button class="cap-theme-chip" data-personality="terminal"><span class="ctp-swatch" style="background:#00ff41"></span>Terminal</button>
          <button class="cap-theme-chip" data-personality="threat"><span class="ctp-swatch" style="background:#cc0000"></span>Threat</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Mode tabs (hidden — mode is now in titlebar pills) ─────────────── -->
  <div class="mode-strip">
    <button class="mode-btn active" data-mode="work"     onclick="setMode('work')"    title="⌘1">Work</button>
    <button class="mode-btn"        data-mode="cyber"    onclick="setMode('cyber')"   title="⌘2">Cyber</button>
    <button class="mode-btn"        data-mode="personal" onclick="setMode('personal')" title="⌘3">Personal</button>
  </div>

  <!-- ── Meta row: template + folder ────────────────────────────────────── -->
  <div class="meta-row">
    <select id="cap-template" class="sel sel-template" onchange="onTemplateChange()"></select>
    <select id="cap-folder"   class="sel sel-folder"></select>
  </div>

  <!-- ── Title ───────────────────────────────────────────────────────────── -->
  <div class="title-row">
    <input id="cap-title" class="title-input" type="text" placeholder="Title (optional — auto-generated if blank)" autocomplete="off">
  </div>

  <!-- ── Content: textarea + preview ────────────────────────────────────── -->
  <div class="content-area" id="content-area">
    <textarea id="cap-text" class="cap-textarea" spellcheck="true"></textarea>
    <div     id="cap-preview" class="cap-preview hidden"></div>
    <div id="fmt-overlay" class="fmt-overlay">
      <div class="fmt-spinner"></div>
      <div class="fmt-label" id="fmt-label">Formatting…</div>
    </div>
  </div>

  <!-- ── AI action chips (mode-specific) ─────────────────────────────────── -->
  <div class="actions-bar" id="actions-bar"></div>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <div class="footer">
    <div class="footer-left">
      <button class="tool-btn" id="btn-preview" onclick="togglePreview()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
      <button class="tool-btn" id="btn-copy" onclick="copyMarkdown()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>
    <div class="footer-right">
      <button class="btn-save" id="btn-save" onclick="saveCapture()">Save →</button>
    </div>
  </div>

  <!-- ── Status bar ───────────────────────────────────────────────────────── -->
  <div class="capture-footer">
    <span id="cf-mode-label">Work Mode</span>
    <span id="cf-char-count">0 chars</span>
    <span class="cf-sig">// ItsEliias</span>
  </div>

</div>

<div id="toast" class="toast"></div>

<!-- ── Load processors ───────────────────────────────────────────────────── -->
<script src="local-ai.js"></script>
<script src="templates.js"></script>

<script>
'use strict';

/* ─── CONSTANTS ─────────────────────────────────────────────────────────── */
const gv = window.ghostvault;

/* ─── THEME LOADING ──────────────────────────────────────────────────────── */
let _capCore = 'stealth', _capPersonality = 'neutral';

async function loadTheme() {
  try {
    // Use capture-specific theme; fall back to main app theme
    const captureTheme = await gv.getCaptureTheme().catch(() => null);
    const windowEl = document.querySelector('.window');
    if (!windowEl) return;

    let core = 'stealth', personality = 'neutral';
    if (captureTheme && typeof captureTheme === 'object' && captureTheme.core) {
      core = captureTheme.core;
      personality = captureTheme.personality || 'neutral';
    } else {
      // Fall back to main app theme
      const cfg = await gv.getConfig().catch(() => ({}));
      const theme = cfg && cfg.theme;
      if (theme && typeof theme === 'object') {
        core = theme.core || 'stealth';
        personality = theme.personality || 'neutral';
      }
    }

    _capCore = core;
    _capPersonality = personality;
    applyCaptureTheme(core, personality);
  } catch (e) { console.warn('Theme load failed:', e); }
}

function applyCaptureTheme(core, personality) {
  const windowEl = document.querySelector('.window');
  if (!windowEl) return;
  _capCore = core;
  _capPersonality = personality;
  windowEl.setAttribute('data-core', core);
  windowEl.setAttribute('data-personality', personality);
  const accentMap = { neutral:'#4a9eff', cyberpunk:'#b44fff', terminal:'#00ff41', threat:'#cc0000' };
  windowEl.style.setProperty('--accent', accentMap[personality] || '#4a9eff');
  // Sync picker chips
  document.querySelectorAll('.cap-theme-chip[data-core]').forEach(c =>
    c.classList.toggle('active', c.dataset.core === core));
  document.querySelectorAll('.cap-theme-chip[data-personality]').forEach(c =>
    c.classList.toggle('active', c.dataset.personality === personality));
  // Update label
  const lbl = document.getElementById('cap-theme-label');
  if (lbl) {
    const cn = {stealth:'Stealth',graphite:'Graphite',frost:'Frost',oled:'OLED'};
    const pn = {neutral:'Neutral',cyberpunk:'Cyber',terminal:'Terminal',threat:'Threat'};
    lbl.textContent = `${cn[core]||core}·${pn[personality]||personality}`;
  }
}

async function setCaptureTheme(core, personality) {
  applyCaptureTheme(core, personality);
  try { await gv.saveCaptureTheme({ core, personality }); } catch (_) {}
}

function initCaptureThemePicker() {
  const btn   = document.getElementById('cap-theme-btn');
  const panel = document.getElementById('cap-theme-panel');
  if (!btn || !panel) return;

  btn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
  document.querySelectorAll('.cap-theme-chip[data-core]').forEach(c => {
    c.addEventListener('click', e => {
      e.stopPropagation();
      setCaptureTheme(c.dataset.core, _capPersonality);
    });
  });
  document.querySelectorAll('.cap-theme-chip[data-personality]').forEach(c => {
    c.addEventListener('click', e => {
      e.stopPropagation();
      setCaptureTheme(_capCore, c.dataset.personality);
    });
  });
}

/* ─── MODE PILLS WIRING ──────────────────────────────────────────────────── */
function initModePills() {
  const pills = document.querySelectorAll('.mode-pill');
  const modeLabels = { work: 'Work Mode', cyber: 'Cyber Mode', personal: 'Personal Mode' };
  pills.forEach(pill => {
    pill.addEventListener('click', () => {
      pills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const mode = pill.dataset.mode;
      const label = document.getElementById('cf-mode-label');
      if (label) label.textContent = modeLabels[mode] || mode;
    });
  });
}

/* ─── CHAR COUNT ─────────────────────────────────────────────────────────── */
function initCharCount() {
  const ta = document.getElementById('cap-text');
  const counter = document.getElementById('cf-char-count');
  if (!ta || !counter) return;
  ta.addEventListener('input', () => {
    const n = ta.value.length;
    counter.textContent = n > 0 ? `${n} char${n !== 1 ? 's' : ''}` : '0 chars';
  });
}

const MODE_CONFIG = {
  work: {
    placeholder: 'Paste call notes, meeting points, issue details, anything from your shift…',
    actions: [
      { id:'format',    label:'✨ Format',    primary:true },
      { id:'todos',     label:'✅ TODOs'                  },
      { id:'summarize', label:'📋 Summary'                },
      { id:'report',    label:'📄 Report'                 },
    ],
  },
  cyber: {
    placeholder: 'Paste terminal output, nmap results, findings, enumeration notes…',
    actions: [
      { id:'format',    label:'✨ Format',    primary:true },
      { id:'iocs',      label:'🔍 IOCs'                   },
      { id:'summarize', label:'📋 Summary'                },
      { id:'todos',     label:'🔑 Next Steps'             },
    ],
  },
  personal: {
    placeholder: 'Brain dump anything here — ideas, reminders, thoughts, lists…',
    actions: [
      { id:'format',    label:'✨ Format',    primary:true },
      { id:'cleanup',   label:'🧹 Clean Up'               },
      { id:'todos',     label:'✅ TODOs'                  },
      { id:'summarize', label:'📋 Summarize'              },
    ],
  },
};

/* ─── STATE ─────────────────────────────────────────────────────────────── */
let currentMode     = localStorage.getItem('cap-mode')     || 'work';
let currentTemplate = localStorage.getItem('cap-template') || '';
let previewVisible  = false;

/* ─── INIT ──────────────────────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', async () => {
  // Load theme first (sets data-core / data-personality on .window)
  await loadTheme();
  initCaptureThemePicker();

  // Wire mode pills and char counter
  initModePills();
  initCharCount();

  // Apply persisted mode
  setMode(currentMode, false);

  // Load folders
  try {
    const cfg = await gv.getConfig();
    if (cfg && cfg.vaultPath) {
      const folders = await gv.listFolders(cfg.vaultPath);
      populateFolders(folders);
    }
  } catch {}

  // Receive folder push from main (when window is shown after vault change)
  gv.onCaptureFolders && gv.onCaptureFolders(populateFolders);

  // Focus textarea
  setTimeout(() => id('cap-text').focus(), 80);
});

/* ─── HELPERS ────────────────────────────────────────────────────────────── */
function id(i) { return document.getElementById(i); }
const ts = () => new Date().toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });

function populateFolders(folders) {
  if (!folders || !folders.length) return;
  const sel   = id('cap-folder');
  const saved = localStorage.getItem('cap-folder') || 'Notes';
  sel.innerHTML = folders.map(f =>
    `<option value="${esc(f)}" ${f===saved?'selected':''}>${esc(f)}</option>`
  ).join('');
  sel.addEventListener('change', () => localStorage.setItem('cap-folder', sel.value));
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── MODE SWITCHING ─────────────────────────────────────────────────────── */
function setMode(mode, save = true) {
  currentMode = mode;
  if (save) localStorage.setItem('cap-mode', mode);

  // Update window accent
  id('win').dataset.mode = mode;

  // Update legacy tab active state (hidden strip)
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  // Sync titlebar pills
  document.querySelectorAll('.mode-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.mode === mode);
  });

  // Sync footer mode label
  const modeLabels = { work: 'Work Mode', cyber: 'Cyber Mode', personal: 'Personal Mode' };
  const label = id('cf-mode-label');
  if (label) label.textContent = modeLabels[mode] || mode;

  // Refresh template list
  populateTemplates(mode);

  // Refresh action chips
  buildActionChips(mode);

  // Update placeholder
  const cfg = MODE_CONFIG[mode];
  id('cap-text').placeholder = cfg ? cfg.placeholder : '';
}

/* ─── TEMPLATES ──────────────────────────────────────────────────────────── */
function populateTemplates(mode) {
  const sel  = id('cap-template');
  const keys = (typeof TEMPLATES_BY_MODE !== 'undefined' && TEMPLATES_BY_MODE[mode]) || [];
  const lbls = (typeof TEMPLATE_LABELS   !== 'undefined' && TEMPLATE_LABELS)         || {};

  sel.innerHTML = `<option value="">— No template —</option>` +
    keys.map(k => `<option value="${esc(k)}">${esc(lbls[k] || k)}</option>`).join('');

  // Restore last used template for this mode
  const saved = localStorage.getItem(`cap-template-${mode}`);
  if (saved && keys.includes(saved)) sel.value = saved;
  else sel.value = '';
}

function onTemplateChange() {
  const sel = id('cap-template');
  const key = sel.value;
  localStorage.setItem(`cap-template-${currentMode}`, key);

  if (!key) return;

  // If textarea is empty, insert template immediately
  const ta = id('cap-text');
  if (!ta.value.trim()) {
    insertTemplate(key);
  } else {
    // Ask via a subtle toast — don't auto-replace existing content
    showToast('Press ⌘⇧I to insert template', false, 2000);
  }
}

function insertTemplate(key) {
  if (!key || typeof TEMPLATES === 'undefined' || !TEMPLATES[key]) return;
  const content = TEMPLATES[key](ts());
  const ta = id('cap-text');
  ta.value = content;
  ta.focus();
  if (previewVisible) renderPreview();
}

/* ─── ACTION CHIPS ───────────────────────────────────────────────────────── */
function buildActionChips(mode) {
  const bar     = id('actions-bar');
  const actions = MODE_CONFIG[mode]?.actions || [];
  bar.innerHTML = '';

  actions.forEach(({ id: aid, label, primary }) => {
    const btn = document.createElement('button');
    btn.className = 'action-chip' + (primary ? ' primary' : '');
    btn.textContent = label;
    btn.onclick = () => runFormat(aid);
    bar.appendChild(btn);
  });
}

/* ─── FORMAT / AI ────────────────────────────────────────────────────────── */
function runFormat(mode) {
  const text = id('cap-text').value.trim();
  if (!text) { showToast('Nothing to format — write some notes first', true); return; }

  const overlay = id('fmt-overlay');
  const lblEl   = id('fmt-label');
  const labels  = {
    format:    'Formatting…',
    summarize: 'Summarizing…',
    iocs:      'Extracting IOCs…',
    todos:     'Building task list…',
    cleanup:   'Cleaning up…',
    report:    'Building report…',
    terminal:  'Structuring input…',
  };
  lblEl.textContent   = labels[mode] || 'Processing…';
  overlay.className   = 'fmt-overlay show';

  // Disable chips while processing
  document.querySelectorAll('.action-chip').forEach(b => b.disabled = true);

  setTimeout(() => {
    try {
      const result = LocalAI.process(mode, text, currentMode);
      overlay.className = 'fmt-overlay';
      document.querySelectorAll('.action-chip').forEach(b => b.disabled = false);

      if (result.error) {
        showToast(result.error, true);
        return;
      }

      id('cap-text').value = result.result;
      if (previewVisible) renderPreview();
      showToast('✓ Done', false, 1600);
    } catch (e) {
      overlay.className = 'fmt-overlay';
      document.querySelectorAll('.action-chip').forEach(b => b.disabled = false);
      showToast('Error: ' + e.message, true);
    }
  }, 30);
}

/* ─── PREVIEW ────────────────────────────────────────────────────────────── */
function togglePreview() {
  previewVisible = !previewVisible;
  const ta  = id('cap-text');
  const pre = id('cap-preview');
  const btn = id('btn-preview');

  if (previewVisible) {
    renderPreview();
    ta.classList.add('hidden');
    pre.classList.remove('hidden');
    btn.classList.add('active');
  } else {
    ta.classList.remove('hidden');
    pre.classList.add('hidden');
    btn.classList.remove('active');
    ta.focus();
  }
}

function renderPreview() {
  id('cap-preview').innerHTML = miniMarkdown(id('cap-text').value);
}

function miniMarkdown(md) {
  if (!md) return '<em style="color:var(--text-muted)">Nothing to preview yet.</em>';
  let h = md;
  // Code blocks
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) =>
    `<pre><code>${htmlEsc(c.trim())}</code></pre>`);
  // Inline code
  h = h.replace(/`([^`]+)`/g, (_, c) => `<code>${htmlEsc(c)}</code>`);
  // Headings
  h = h.replace(/^#{3}\s+(.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^#{2}\s+(.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^#{1}\s+(.+)$/gm, '<h1>$1</h1>');
  // HR
  h = h.replace(/^[-*_]{3,}\s*$/gm, '<hr>');
  // Blockquote
  h = h.replace(/^>\s?(.+)$/gm, '<blockquote>$1</blockquote>');
  // Bold / italic
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g,     '<em>$1</em>');
  // Tables
  h = h.replace(/((?:\|[^\n]+\|\n)+)/g, tbl => {
    const rows = tbl.trim().split('\n').filter(r => !/^\|[-| :]+\|$/.test(r.trim()));
    if (rows.length < 1) return tbl;
    const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
    return `<table><thead><tr>${cells(rows[0]).map(c=>`<th>${c}</th>`).join('')}</tr></thead>`
      + `<tbody>${rows.slice(1).map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  });
  // Checkboxes
  h = h.replace(/^(\s*)-\s*\[x\]\s*(.+)$/gim, '<div class="md-check">☑ <span style="text-decoration:line-through;color:var(--text-muted)">$2</span></div>');
  h = h.replace(/^(\s*)-\s*\[ \]\s*(.+)$/gim, '<div class="md-check">☐ $2</div>');
  // Lists
  h = h.replace(/^(\s*)[-*+] (.+)$/gm,   (_, ind, item) => `<li style="margin-left:${ind.length*8}px">${item}</li>`);
  h = h.replace(/^(\s*)\d+\. (.+)$/gm,   (_, ind, item) => `<li style="margin-left:${ind.length*8}px">${item}</li>`);
  h = h.replace(/(<li[\s\S]*?<\/li>\n?)+/g, block => `<ul style="padding-left:0;list-style:none">${block}</ul>`);
  // Paragraphs
  h = h.replace(/\n\n+/g, '</p><p>');
  h = `<p>${h}</p>`;
  h = h.replace(/<p>\s*<\/p>/g, '');
  h = h.replace(/<p>(<(?:h[1-6]|pre|ul|hr|blockquote|div|table)[^>]*>)/g, '$1');
  h = h.replace(/(<\/(?:h[1-6]|pre|ul|hr|blockquote|div|table)>)<\/p>/g, '$1');
  return h;
}
function htmlEsc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ─── COPY ───────────────────────────────────────────────────────────────── */
function copyMarkdown() {
  const text = id('cap-text').value;
  if (!text) { showToast('Nothing to copy', true, 1500); return; }
  navigator.clipboard.writeText(text).then(() => {
    const btn = id('btn-copy');
    btn.classList.add('active');
    showToast('Copied!', false, 1400);
    setTimeout(() => btn.classList.remove('active'), 1400);
  }).catch(() => showToast('Copy failed', true));
}

/* ─── SAVE ───────────────────────────────────────────────────────────────── */
async function saveCapture() {
  const folder = id('cap-folder').value   || 'Notes';
  const title  = id('cap-title').value.trim();
  const text   = id('cap-text').value.trim();
  if (!text) { showToast('Nothing to save', true, 1500); return; }

  const btn = id('btn-save');
  btn.disabled = true;

  try {
    const result = await gv.saveCaptureNote({ folder, title, text });
    if (result && result.ok) {
      showToast('✓ Saved!', false, 1800);
      setTimeout(() => {
        id('cap-title').value = '';
        id('cap-text').value  = '';
        if (previewVisible) togglePreview();
        id('cap-template').value = '';
        hideSelf();
      }, 700);
    } else {
      showToast('Save failed', true);
    }
  } catch (e) {
    showToast('Error: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

/* ─── WINDOW CONTROLS ────────────────────────────────────────────────────── */
function hideSelf()     { gv.hideCapture     && gv.hideCapture(); }
function minimizeSelf() { gv.minimizeCapture && gv.minimizeCapture(); }

/* ─── KEYBOARD ───────────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  const cmd = e.metaKey || e.ctrlKey;

  // Cmd+Enter → save
  if (cmd && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveCapture(); return; }

  // Escape → hide
  if (e.key === 'Escape') { e.preventDefault(); hideSelf(); return; }

  // Cmd+Shift+P → toggle preview
  if (cmd && e.shiftKey && e.key === 'p') { e.preventDefault(); togglePreview(); return; }

  // Cmd+Shift+I → insert selected template
  if (cmd && e.shiftKey && e.key === 'i') {
    e.preventDefault();
    const key = id('cap-template').value;
    if (key) insertTemplate(key);
    return;
  }

  // Cmd+1/2/3 → switch modes
  if (cmd && e.key === '1') { e.preventDefault(); setMode('work');     return; }
  if (cmd && e.key === '2') { e.preventDefault(); setMode('cyber');    return; }
  if (cmd && e.key === '3') { e.preventDefault(); setMode('personal'); return; }

  // Cmd+Shift+F → quick format (primary action)
  if (cmd && e.shiftKey && e.key === 'f') { e.preventDefault(); runFormat('format'); return; }
});

// Live preview update while typing (if preview visible)
id('cap-text').addEventListener('input', () => {
  if (previewVisible) renderPreview();
});

/* ─── TOAST ──────────────────────────────────────────────────────────────── */
function showToast(msg, isErr = false, ms = 2200) {
  const t = id('toast');
  t.textContent = msg;
  t.className   = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, ms);
}
</script>
</body>
