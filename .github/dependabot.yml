# Dependabot — automatic dependency PRs per app.
#
# Each CyberOS app is its own npm project with an independent package-lock,
# so Dependabot needs an entry per directory. Grouped by ecosystem so a
# single React minor bump doesn't open 12 separate PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /CredVault
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      react:     { patterns: ["react", "react-dom", "@types/react*"] }
      electron:  { patterns: ["electron", "electron-vite", "electron-builder"] }
      types:     { patterns: ["@types/*"] }

  - package-ecosystem: npm
    directory: /VaultCore
